# Cloudflare Pages config for Cineprompt.
# `wrangler pages deploy` reads pages_build_output_dir, so you can deploy with
# just `npx wrangler pages deploy` after `npm run build`.
name = "cineprompt"
pages_build_output_dir = "dist/public"
compatibility_date = "2026-06-28"

# D1 (SQLite) for the stateful store (dismiss / shortlist / watched / notes).
# database_id is filled in after `wrangler d1 create cineprompt-db`.
[[d1_databases]]
binding = "DB"
database_name = "cineprompt-db"
database_id = "PLACEHOLDER_SET_AFTER_D1_CREATE"
