<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f0f10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cineprompt" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Posters/backdrops all come from TMDB's CDN; warm the connection early. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <!-- Start the core payload download during HTML parse, in parallel with the
         JS. crossorigin matches fetch()'s default credentials mode so the
         preload is reused instead of downloaded twice. Route-scoped shards
         (collections, tags, canon, craft, per-director) are fetched on demand
         — see script/data-shards.ts. -->
    <link rel="preload" href="./data/core.json" as="fetch" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..700&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400..600&family=Playfair+Display:ital,wght@0,400..900;1,400..700&display=swap"
      rel="stylesheet"
    />
    <title>Cineprompt — for Dalton @ Lunara Film</title>
    <meta name="description" content="A film-watching companion for serious cinephiles. Today's pick, the queue, blind spots, directors, and viewing pace." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
