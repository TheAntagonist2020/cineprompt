name: Update & Deploy Cineprompt

# Keeps the live site current with what you've watched, with no manual steps:
#   - on a schedule: fold in the Letterboxd diary -> rebuild the unseen-picks
#     engine (Trakt layered on top if configured) -> apply in-app choices -> deploy
#   - on manual "Run workflow": same (force a refresh on demand). The `reason`
#     input is how IFTTT drives it (see DEPLOY.md): a Trakt scrobble fires
#     `watched` (rebuild, then only the "log it on Letterboxd" prompt), and
#     timed applets fire `morning` / `evening` / `followup` on the minute,
#     which the crons below cannot promise.
#   - on push to main: redeploy code changes (no API rebuild)
on:
  schedule:
    # Cron is ALWAYS UTC and ignores DST. Central is UTC-5 (CDT) / UTC-6 (CST).
    - cron: "17 13 * * *"   # ~morning CT (08:17 CDT / 07:17 CST): refresh only, no nudge
    - cron: "30 0 * * *"    # ~evening CT (19:30 CDT / 18:30 CST): refresh + the nudge
    - cron: "0 2 * * *"     # ~late CT (21:00 CDT / 20:00 CST): follow-up, only if nothing logged today
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run fires (decides the phone nudge)"
        type: choice
        default: manual
        options: [manual, morning, evening, followup, watched]
      force_nudge:
        description: "Send the nudge even if this one already went out today"
        type: boolean
        default: false
  push:
    branches: [main]

# Read-only token: we deploy to Cloudflare and never commit back to the repo.
permissions:
  contents: read

# Don't let an overlapping scheduled run clobber the cache mid-write.
concurrency:
  group: update-cineprompt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # generous headroom for the first cold run (TMDB cache built from scratch);
    # later runs restore the cache and finish in a couple of minutes
    timeout-minutes: 45
    env:
      # guarantee the '★' in pick reasons prints under any runner locale
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Persist AND update the TMDB metadata cache across runs.
      # A cache key is immutable, so the key rotates (run_id + attempt) to
      # write a fresh entry every run, while restore-keys pulls the most
      # recent prior copy as a warm-start seed. First ever run is cold
      # (fetches metadata live). The attempt is in the key because a re-run
      # of a failed run reuses its run_id: an exact hit skips the save, and
      # whatever that re-run learned (and sent) would be forgotten.
      - name: Restore TMDB cache
        uses: actions/cache@v6
        with:
          path: datagen/.tmdb_cache.json
          key: tmdb-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tmdb-cache-${{ runner.os }}-

      # Hand the latest rebuilt data.json from scheduled runs to push deploys.
      # A code push skips the rebuild, so without this it ships whatever
      # snapshot is committed in the repo, which can be weeks old. Same
      # rotating-key pattern as the TMDB cache: every run saves at the end,
      # every run restores the most recent prior copy at the start.
      - name: Restore latest rebuilt data
        uses: actions/cache@v6
        with:
          path: client/public/data.json
          key: data-json-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            data-json-${{ runner.os }}-

      # The accumulated Letterboxd profile (seen set, ratings, dated diary) —
      # the source of truth for taste and for "seen". Same rotating-key
      # pattern. Losing it is not fatal (it re-bootstraps from data.json and
      # re-resolves against the TMDB cache) but it would forget diary entries
      # older than the RSS window, so it is kept. The nudge log rides along:
      # it is how a run knows tonight's nudge already went out (the GitHub
      # cron and the IFTTT applet both fire; the first one wins).
      - name: Restore Letterboxd profile
        uses: actions/cache@v6
        with:
          path: |
            datagen/.letterboxd_profile.json
            datagen/.nudge_log.json
          key: letterboxd-profile-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            letterboxd-profile-${{ runner.os }}-

      # The restore overwrites the checked-out file even when the commit is
      # newer (a fresh data.json committed by hand). Keep whichever is fresher.
      - name: Keep the fresher data.json
        id: fresher
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'EOF'
          import json, os, subprocess
          path = "client/public/data.json"
          def stamp(text):
              try:
                  return json.loads(text).get("generated_at") or ""
              except Exception:
                  return ""
          restored = stamp(open(path, encoding="utf-8").read())
          committed = stamp(subprocess.run(["git", "show", f"HEAD:{path}"],
                                           capture_output=True, text=True).stdout)
          if committed >= restored:
              subprocess.run(["git", "checkout", "--", path], check=True)
              chosen = "committed"
              print(f"kept committed data.json ({committed}); cache had {restored or 'nothing newer'}")
          else:
              chosen = "restored from last run"
              print(f"kept restored data.json ({restored}) over committed ({committed})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"source={chosen}\n")
          EOF

      - name: Install JS deps
        run: npm ci

      # Letterboxd first. Folds the public RSS diary (50 newest entries, TMDB
      # ids included) into the accumulated profile and resolves any title
      # still missing a TMDB id through the cached TMDB search. Runs before
      # the rebuild so the engine's "seen" set is complete on this run, not
      # the next. Non-fatal: a feed hiccup must never block the deploy.
      - name: Update the Letterboxd profile (RSS + TMDB ids)
        id: profile
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LETTERBOXD_USER: ${{ secrets.LETTERBOXD_USER }}
          PYTHONUTF8: "1"
        run: python datagen/letterboxd_profile.py client/public/data.json

      # Rebuild recommendations from the Letterboxd profile, with Trakt
      # layered on top when its secrets are present (it is optional now).
      # Skipped on plain code pushes (those just redeploy the committed data).
      - name: Rebuild recommendation data
        if: github.event_name != 'push'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_USER: ${{ secrets.TRAKT_USER }}
        run: python datagen/rebuild.py

      # Fold in your recent Letterboxd diary (public RSS — no API key). This is
      # how watches from services with no scrobbler (Criterion Channel above
      # all) reach the site: you log them on Letterboxd, they land here.
      # Non-fatal so a Letterboxd hiccup never blocks the deploy.
      - name: Sync recent Letterboxd diary (RSS)
        id: letterboxd
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          LETTERBOXD_USER: ${{ secrets.LETTERBOXD_USER }}
          PYTHONUTF8: "1"
        run: python datagen/letterboxd_rss.py client/public/data.json client/public/data.json

      # Rebuild the Canon checklists from your own MDBList lists (exact TMDB ids
      # -> accurate seen/unseen). Non-fatal so a MDBList hiccup never blocks deploy.
      - name: Rebuild canon from your MDBList lists
        id: canon
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          PYTHONUTF8: "1"
        run: python datagen/build_lists.py

      # Honour what you decided in the app. Reads film_state from D1 and
      # prunes dismissed / watched / not-tonight films from every pool before
      # the Stremio row and the nudge are built, and puts your shortlist first
      # in both. Needs CLOUDFLARE_API_TOKEN to carry "D1: Edit" as well as
      # "Pages: Edit" (see DEPLOY.md); until it does, this step reports and
      # the pipeline carries on with the app filtering client-side.
      - name: Apply in-app choices (shortlist / not tonight / watched)
        id: state
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # your calendar day for "not tonight" (repo variable; default America/Chicago)
          USER_TZ: ${{ vars.USER_TZ }}
          PYTHONUTF8: "1"
        run: |
          npx wrangler@4 d1 execute cineprompt-db --remote --json \
            --command "SELECT tmdb_id, status, snooze_until, rating, updated_at, title, year, poster, imdb_id, directors, runtime, reasons FROM film_state" \
            > state.json
          python datagen/apply_state.py client/public/data.json state.json

      # Push the current picks to the "Cineprompt — Tonight" MDBList list, which
      # surfaces in Stremio. Non-fatal: a MDBList hiccup must not block the deploy.
      - name: Sync picks to MDBList (Stremio)
        id: mdblist
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          PYTHONUTF8: "1"
        run: python datagen/mdblist_sync.py

      # A push deploy skips every step above, so it would ship the data.json
      # committed in the repo — a snapshot that can be weeks old, whose 14-day
      # slate window has already ended. The app falls back to slates[0] when no
      # slate matches today, so Today would sit on a date in the past until the
      # next scheduled run.
      #
      # Rolling the window forward fixes that. It reuses the films already in
      # data.json, so it needs no API keys and no network, and it leaves every
      # curated section (queue, directors, canon, ...) untouched. The watch
      # history stays as stale as the committed snapshot — only the scheduled
      # runs above can refresh that — but Today is at least on today.
      - name: Roll the slate window forward to today
        if: github.event_name == 'push'
        env:
          PYTHONUTF8: "1"
        run: python datagen/refresh_slates.py

      # Client-only build (dist/public). Avoids coupling the static deploy to
      # the Express server bundle, which Pages never ships.
      - name: Build site
        run: npm run build:client

      # In CI, `wrangler pages deploy` will NOT auto-create the project, so
      # create it first. Tolerate ONLY the "already exists" case — a real auth
      # failure (bad token / account id) surfaces here instead of being masked.
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler@4 pages project create cineprompt --production-branch=main 2>err.log; then
            cat err.log
            grep -qi "already" err.log || { echo "::error::Pages project create failed (check CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)"; exit 1; }
            echo "Project already exists — continuing."
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist/public --project-name=cineprompt --branch=main

      # ---- The push half -------------------------------------------------
      # Everything above updates the site and waits for you to visit it. This
      # sends the picks to your phone so the site doesn't have to be visited
      # at all. Evening run, follow-up, and dispatches other than `morning`:
      # a nudge at 08:17 is noise. A `watched` dispatch (IFTTT, right after a
      # Trakt scrobble) sends only the "log it on Letterboxd" prompt, and
      # nothing when the diary already has it. nudge.py keeps a log so the
      # same nudge never goes out twice in a day, whichever trigger got
      # there first. Runs after the deploy and is non-fatal, so it can never
      # cost a deploy.
      - name: Nudge me to watch something
        id: nudge
        if: >-
          (github.event_name == 'workflow_dispatch' && github.event.inputs.reason != 'morning') ||
          github.event.schedule == '30 0 * * *' ||
          github.event.schedule == '0 2 * * *'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          # 9pm cron / `followup` -> the quiet follow-up; `watched` -> the diary
          # prompt only; everything else (evening cron, manual, `evening`) -> main nudge
          NUDGE_MODE: >-
            ${{ (github.event.schedule == '0 2 * * *' || github.event.inputs.reason == 'followup') && 'followup'
                || github.event.inputs.reason == 'watched' && 'log'
                || 'evening' }}
          NUDGE_FORCE: ${{ github.event.inputs.force_nudge == 'true' && '1' || '' }}
          # repo variable (Settings -> Variables): set to 1 to use web.stremio.com links
          STREMIO_WEB: ${{ vars.STREMIO_WEB }}
          # the nudge's day is your calendar day, not the runner's UTC date
          NUDGE_TZ: ${{ vars.USER_TZ }}
          PYTHONUTF8: "1"
        run: python datagen/nudge.py client/public/data.json

      # Several steps above are continue-on-error, so the job goes green even
      # when they all failed and the data never actually refreshed. Spell out
      # what really happened, so a green check can be trusted.
      - name: Report what actually ran
        if: always()
        run: |
          {
            echo "### Data freshness"
            echo
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| Letterboxd profile (RSS + TMDB ids) | ${{ steps.profile.outcome || 'skipped' }} |"
            echo "| Letterboxd diary (RSS) | ${{ steps.letterboxd.outcome || 'skipped' }} |"
            echo "| In-app choices (D1) | ${{ steps.state.outcome || 'skipped' }} |"
            echo "| Canon from MDBList | ${{ steps.canon.outcome || 'skipped' }} |"
            echo "| Picks to MDBList (Stremio) | ${{ steps.mdblist.outcome || 'skipped' }} |"
            echo "| Phone nudge | ${{ steps.nudge.outcome || 'skipped' }} |"
            echo "| data.json source | ${{ steps.fresher.outputs.source || 'n/a' }} |"
            echo
            echo "Trigger: \`${{ github.event_name }}\` ${{ github.event.schedule }} ${{ github.event.inputs.reason }}"
            echo
            echo "\`generated_at\` in the deployed payload:"
            echo
            echo '```'
            python -c "import json;d=json.load(open('client/public/data.json'));print(d.get('generated_at','(missing)'));t=d.get('taste') or {};print('taste:',t.get('sources'),'watches in window:',t.get('watches'),'decades:',dict(list((t.get('decades') or {}).items())[:4]))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A broken loop that fails quietly is how the site ends up serving
      # two-month-old picks with nobody noticing. Make it shout.
      - name: Alert me if this run broke
        if: failure() || steps.nudge.outcome == 'failure'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NUDGE_OUTCOME: ${{ steps.nudge.outcome }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "NTFY_TOPIC unset - no alert sent."; exit 0; }
          python - <<'EOF'
          import json, os, urllib.request
          server = (os.environ.get("NTFY_SERVER") or "https://ntfy.sh").rstrip("/")
          nudge_only = (os.environ.get("JOB_STATUS") == "success"
                        and os.environ.get("NUDGE_OUTCOME") == "failure")
          body = json.dumps({
              "topic": os.environ["NTFY_TOPIC"],
              "title": "Cineprompt nudge crashed" if nudge_only else "Cineprompt update failed",
              "message": ("The site deployed fine, but the phone nudge crashed, so no picks "
                          "were sent tonight. The run log has the traceback."
                          if nudge_only else
                          "The scheduled rebuild broke, so the site is serving "
                          "stale picks until it is fixed."),
              "priority": 5,
              "tags": ["rotating_light"],
              "click": os.environ.get("RUN_URL", ""),
          }).encode()
          req = urllib.request.Request(server + "/", data=body,
                                       headers={"Content-Type": "application/json"},
                                       method="POST")
          with urllib.request.urlopen(req, timeout=20) as r:
              print("alert sent:", r.status)
          EOF
